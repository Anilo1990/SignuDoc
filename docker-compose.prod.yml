services:
  db:
    image: postgres:17
    container_name: signudoc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /volume2/docker/signudoc/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signudoc -d signudoc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signudoc_backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signudoc
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://signudoc:${POSTGRES_PASSWORD}@db:5432/signudoc
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/.data/storage
      APP_URL: ${APP_URL}
      SSO_ISSUER: ${SSO_ISSUER}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
      SSO_NAME: Pocket ID
    volumes:
      - /volume2/docker/signudoc/documents:/app/.data/storage
    networks:
      - proxy
      - signudoc_backend

networks:
  proxy:
    external: true
    name: proxy

  signudoc_backend:
    name: signudoc_backend
    internal: true
